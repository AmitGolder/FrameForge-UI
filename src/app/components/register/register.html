<div class="register-container">

  <div class="register-card">

    <h2>Create Account</h2>

    <p class="subtitle">
      Create your FrameForge account.
    </p>

    <div class="form-group">

      <label>Name</label>

      <input
        type="text"
        [(ngModel)]="name"
        placeholder="Enter your name">

    </div>

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter your email">

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Create a password">

    </div>

    <div class="form-group">

      <label>Confirm Password</label>

      <input
        type="password"
        [(ngModel)]="confirmPassword"
        placeholder="Confirm your password">

    </div>

    @if (errorMessage) {

      <div class="error-message">
        {{ errorMessage }}
      </div>

    }

    <button
      class="register-btn"
      (click)="register()"
      [disabled]="isLoading">

      @if (isLoading) {
        Creating Account...
      }
      @else {
        Create Account
      }

    </button>

    <p class="login-link">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>
