<div class="login-container">

  <h2>Login</h2>

  <div class="form-group">

    <label>Email</label>

    <input
      type="email"
      [(ngModel)]="email"
      placeholder="Enter your email">

  </div>

  <div class="form-group">

    <label>Password</label>

    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Enter your password">

  </div>

  @if (errorMessage) {

    <p class="error">
      {{ errorMessage }}
    </p>

  }

  <button (click)="login()">
    Login
  </button>

  <p class="register-link">

    Don't have an account?

    <a routerLink="/register">
      Create an account
    </a>

  </p>

</div>
